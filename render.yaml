services:
  # The Django Backend Web Service
  - type: web
    name: smartsketch-api
    env: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend-service
    plan: starter # Starter plan recommended for enough RAM, but free can work for testing
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartsketch-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Add COLAB_ML_URL manually in the Render dashboard later!

databases:
  # The Managed PostgreSQL Database
  - name: smartsketch-db
    databaseName: smartsketch
    user: smartsketch_user
    plan: free # Free tier database
