name: Frontend CI

on:
  push:
    branches: [ "main", "frontend" ]
    paths:
      - 'frontend-app/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend-app/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-app/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend-app/frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: frontend-app/frontend
        run: npm run build
